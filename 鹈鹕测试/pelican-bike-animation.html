<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>鹈鹕骑自行车</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #c9ece7;
    }

    main {
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 20px;
    }

    svg {
      display: block;
      width: min(100%, 1100px);
      height: auto;
      overflow: hidden;
    }

    @media (max-width: 520px) {
      main {
        padding: 8px;
      }
    }
  </style>
</head>

          <circle cx="0" cy="-27" r="4" fill="#f0bd58" stroke-width="2" />
          <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="1.35s" repeatCount="indefinite" />

        <!-- 车轮、曲柄和腿部共用周期，让脚掌始终跟随各自的踏板。 -->

  </main>
  <script>
    const scene = document.querySelector("#ride-scene");
    const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");

    // 尊重系统的减弱动态设置，避免 SVG 动画持续运动。
    const syncMotionPreference = () => {
      if (motionPreference.matches) {
        scene.pauseAnimations();
      } else {
        scene.unpauseAnimations();
      }
    };

    syncMotionPreference();
    motionPreference.addEventListener("change", syncMotionPreference);
  </script>
</body>
</html>
