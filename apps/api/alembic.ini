[alembic]
# Migration script directory, relative to this file.
script_location = alembic
# Package lives under src/: put it on sys.path so future data migrations can import tender.*
prepend_sys_path = src

# Connection string is deliberately NOT stored here -- env.py reads it from the
# TENDER_DATABASE_URL environment variable (see docs/工程/07 for deployment shapes).
sqlalchemy.url =

# NOTE: this file must stay ASCII-only.
# alembic reads alembic.ini with encoding="locale" (alembic/util/compat.py),
# which resolves to GBK on a zh-CN Windows box -> a single non-ASCII byte here
# makes every alembic command die with UnicodeDecodeError before env.py runs.
# The Chinese rationale for these settings lives in alembic/env.py instead.