[build-system]
# 现在起是可安装包（editable 装进 .venv）。原因是 import-linter 必须真的能 import 到
# root package 才能扫描依赖方向；靠 PYTHONPATH 手工喂路径的命令没人会记得写。
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tender-api"
version = "0.0.0"
description = "AI-Tender 后端：API + Worker + Scheduler 同一代码库（目录约定见 docs/工程/10 第 4.2 节）"
requires-python = ">=3.12"
# 运行时依赖按当前已落地的 API、对象存储、PDF 探测与异步任务能力分组。
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # 适配器统一用它（async；见 docs/工程/10 第 2 节）。只在 adapters 层 import，
    # 上层依赖的是 ports 里的 Protocol，不认识 httpx。
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # 统一项目与第三方日志；tzdata 让 Windows 也能按 IANA 时区切分文件。
    "structlog>=25,<26",
    "tzdata>=2025.1",
    "python-multipart>=0.0.9",
    "boto3>=1.35",
    "pypdfium2>=4.30",
    "celery[redis]>=5.4",
    # 配置中心的活动配置缓存（08 第 8 节）：celery[redis] 会带 redis-py，
    # 但直接 import redis 的模块必须自己声明依赖，不能靠传递依赖。
    "redis>=5.0",
    # 生图测试必须解码校验可读性，不能将任意 base64 当图片返回浏览器。
    "pillow>=12.3",
    # 供应商密钥加密（Fernet）：主密钥来自 LLM_SECRET_KEYS，见 core/secrets.py。
    "cryptography>=43.0",
    "deepagents==0.7.22",
    "langchain-openai>=1.1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg-pool>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # ruff 一个工具替代 flake8 + isort + black；版本口径见 docs/工程/10 第 2 节
    "ruff>=0.9",
    # 分层依赖方向必须由工具强制：规则一旦靠自觉遵守，三个月后必然破防（docs/工程/10 第 4.4 节）
    "import-linter>=2.0",
    # 只用于生成合成样本（scripts/make_sample_pdf.py）。用 reportlab 而不是内嵌系统字体：
    # 内嵌宋体/雅黑属于再分发字体程序，而样本 PDF 要进版本库（见 docs/工程/07 第 3 节）。
    "reportlab>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tender"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# 中文注释按字符数计宽（一个汉字算 1 个字），100 已经是相当宽的一行，再宽就没法并排看 diff 了
line-length = 100
target-version = "py312"
# 必须显式写：不写的话 ruff 会把 apps/api/alembic/（迁移目录）当成第一方包，
# 因为它和 alembic 库同名——结果是 import 排序把 alembic 与 tender 归到同一组。
src = ["src"]

[tool.ruff.lint]
# E/F 是默认规则；I 管 import 顺序，UP 管过时写法，B 是常见陷阱（可变默认参数之类）
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 迁移里的 SQL 是逐字对应设计文档的，折行会让「文档 ↔ 迁移」的比对变难。
# 这条豁免是刻意的：让工具迁就事实源，而不是让事实源迁就工具。
"alembic/versions/*.py" = ["E501"]

[tool.importlinter]
root_package = "tender"

# 依赖方向见 docs/工程/10 第 4.4 节。四张契约各自管一件事，不要合并成一条——
# 合并后报错只会说「分层错了」，说不清错在哪一层。
[[tool.importlinter.contracts]]
name = "分层只能向内：domain ← ports ← application ← api"
type = "layers"
layers = ["tender.api", "tender.application", "tender.ports", "tender.domain"]

[[tool.importlinter.contracts]]
name = "用例层不依赖具体实现（application 与 adapters 互不引用）"
type = "independence"
modules = ["tender.application", "tender.adapters"]

[[tool.importlinter.contracts]]
name = "api 与 worker 互不依赖，只通过数据库与队列通信"
type = "independence"
modules = ["tender.api", "tender.worker"]

[[tool.importlinter.contracts]]
name = "domain 是纯的：不引入任何其它内部分层"
type = "forbidden"
source_modules = ["tender.domain"]
forbidden_modules = [
    "tender.ports",
    "tender.application",
    "tender.adapters",
    "tender.api",
    "tender.worker",
    "tender.config",
    "tender.core",
]

# 装配容器（core/di.py）将来要同时知道所有层，它出现时改成列举式 source_modules，
# 把 di.py 排除掉即可；在此之前 core 保持「只能被依赖」。
[[tool.importlinter.contracts]]
name = "core 只能被依赖：不反向引用任何业务分层"
type = "forbidden"
source_modules = ["tender.core.settings", "tender.core.logging", "tender.core.redaction"]
forbidden_modules = [
    "tender.ports",
    "tender.application",
    "tender.adapters",
    "tender.api",
    "tender.worker",
    "tender.config",
]
