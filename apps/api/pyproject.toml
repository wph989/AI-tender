[build-system]
# 安装成可导入的包，让 import-linter 直接扫描真实依赖方向。
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tender-api"
version = "0.0.0"
description = "AI-Tender 后端：API + Worker + Scheduler 同一代码库（目录约定见 docs/工程/10-技术选型与工程结构.md）"
requires-python = ">=3.12"
# 运行时依赖按当前已落地的 API、对象存储、PDF 探测与异步任务能力分组。
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # 适配器统一用它（async；见 docs/工程/10-技术选型与工程结构.md）。只在 adapters 层 import，
    # 上层依赖的是 ports 里的 Protocol，不认识 httpx。
    "httpx>=0.28",
    # Anthropic/GenAI新SDK使用httpx2，原始流适配也须识别其响应和传输错误。
    "httpx2>=2.13,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # 统一项目与第三方日志；tzdata 让 Windows 也能按 IANA 时区切分文件。
    "structlog>=25,<26",
    "tzdata>=2025.1",
    "python-multipart>=0.0.9",
    "boto3>=1.35",
    "pypdfium2>=4.30",
    "celery[redis]>=5.4",
    # 配置中心的活动配置缓存（docs/质量/08-动态配置中心.md）：celery[redis] 会带 redis-py，
    # 但直接 import redis 的模块必须自己声明依赖，不能靠传递依赖。
    "redis>=5.0",
    # 生图测试必须解码校验可读性，不能将任意 base64 当图片返回浏览器。
    "pillow>=12.3",
    # 供应商密钥加密（Fernet）：主密钥来自 LLM_SECRET_KEYS，见 core/secrets.py。
    "cryptography>=43.0",
    "deepagents==0.7.22",
    "langchain-openai>=1.1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg-pool>=3.2,<4",
    "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # 统一检查语法、导入顺序与过时写法。
    "ruff>=0.9",
    # 分层依赖由自动检查约束，防止用例直接引用具体实现。
    "import-linter>=2.0",
    # 协议签名必须由静态检查核对，依赖方向检查不能代替实现兼容性验证。
    "mypy>=1.18,<2",
    # 只用于生成合成样本（scripts/make_sample_pdf.py）。用 reportlab 而不是内嵌系统字体：
    # 内嵌宋体/雅黑属于再分发字体程序，而样本 PDF 要进版本库（见 docs/工程/07-部署与实施计划.md）。
    "reportlab>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tender"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
# 对端口、装配边界和关键应用契约持续做类型检查，不把现有业务中的 Any 当作全量 strict。
# silent 仍解析导入实现的签名，只不报告非目标模块内部的存量类型问题；不能改成 skip。
files = [
    "src/tender/ports", "src/tender/core/di.py",
    "src/tender/application/shared/research.py", "src/tender/application/knowledge/retrieval.py",
    "src/tender/application/analysis/drafts.py", "src/tender/application/analysis/skill_agent.py",
    "src/tender/application/analysis/runtime.py", "src/tender/adapters/analysis/file_archive.py",
    "src/tender/application/jobs/service.py", "src/tender/domain/knowledge/text.py",
    "src/tender/adapters/pg/repositories/analysis/reports.py",
    "src/tender/adapters/pg/repositories/llm/retrieval.py",
    "src/tender/application/knowledge/service.py",
    "src/tender/application/knowledge/qa_agent.py",
    "src/tender/adapters/pg/repositories/knowledge/retrieval.py",
    # 同时检查 Worker 的端口消费位置，避免只核对装配而漏掉未声明的实际调用。
    "src/tender/worker/documents/tasks.py",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
python_version = "3.12"
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
# 限制单行显示宽度，保留并排阅读差异的空间。
line-length = 100
target-version = "py312"
# 必须显式写：不写的话 ruff 会把 apps/api/alembic/（迁移目录）当成第一方包，
# 因为它和 alembic 库同名——结果是 import 排序把 alembic 与 tender 归到同一组。
src = ["src"]

[tool.ruff.lint]
# E/F 是默认规则；I 管 import 顺序，UP 管过时写法，B 是常见陷阱（可变默认参数之类）
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 基线 SQL 是物理结构事实源，保留数据库语句便于核对约束与索引。
"alembic/versions/*.py" = ["E501"]

[tool.importlinter]
root_package = "tender"

# 依赖方向见 docs/工程/10-技术选型与工程结构.md。五张契约各自管一件事，不要合并成一条——
# 合并后报错只会说「分层错了」，说不清错在哪一层。
[[tool.importlinter.contracts]]
name = "分层只能向内：domain ← ports ← application ← api/worker"
type = "layers"
layers = ["tender.api | tender.worker", "tender.application", "tender.ports", "tender.domain"]

[[tool.importlinter.contracts]]
name = "用例层不依赖具体实现（application 与 adapters 互不引用）"
type = "independence"
modules = ["tender.application", "tender.adapters"]

[[tool.importlinter.contracts]]
name = "api 与 worker 互不依赖，只通过数据库与队列通信"
type = "independence"
modules = ["tender.api", "tender.worker"]

[[tool.importlinter.contracts]]
name = "domain 是纯的：不引入任何其它内部分层"
type = "forbidden"
source_modules = ["tender.domain"]
forbidden_modules = [
    "tender.ports",
    "tender.application",
    "tender.adapters",
    "tender.api",
    "tender.worker",
    "tender.config",
    "tender.core",
]

# 装配容器 core/di.py 连接各层；设置、日志与脱敏模块保持独立，不反向依赖业务。
[[tool.importlinter.contracts]]
name = "core 只能被依赖：不反向引用任何业务分层"
type = "forbidden"
source_modules = ["tender.core.settings", "tender.core.logging", "tender.core.redaction"]
forbidden_modules = [
    "tender.ports",
    "tender.application",
    "tender.adapters",
    "tender.api",
    "tender.worker",
    "tender.config",
]
